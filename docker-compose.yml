# ════════════════════════════════════════════════════════════════════════════
#  Local Solr playground
#
#  Single Solr container with ZooKeeper running INSIDE the Solr process
#  (embedded mode — no separate ZK containers), plus Redis for the
#  store-availability bitmaps.
#
#  Quick start:
#    docker compose up --build -d      # build + start solr + redis
#    make collection                   # create the bestbuy collection
#    make seed-redis                   # seed sample store-availability bitmaps
#    make load-data                    # index sample Best Buy products
#
#  Solr UI:  http://localhost:8983/solr
#  Redis:    localhost:6379  (no password — local only)
# ════════════════════════════════════════════════════════════════════════════

services:

  # ── Single Solr node with embedded ZooKeeper ─────────────────────────────────
  solr:
    image: solr-experiments/solr:local
    build:
      context: .
      dockerfile: docker/solr/Dockerfile
    hostname: solr
    environment:
      SOLR_MODE: embedded                 # ZooKeeper runs inside the Solr process
      SOLR_HEAP: ${SOLR_HEAP:-1g}
      REDIS_HOST: redis                   # passed to the plugin as -Dredis.host
      REDIS_PORT: "6379"
      AUTO_CREATE_COLLECTION: "true"      # create 'bestbuy' on first start
    ports:
      - "8983:8983"                       # Solr UI + API
    volumes:
      - solr-data:/var/solr/data
      # Mount local config so schema/solrconfig edits apply on restart
      # without rebuilding the image.
      - ./solr-config/bestbuy:/opt/solr/server/solr/configsets/bestbuy/conf:ro
    networks: [solr-net]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Redis (store-availability bitmaps) ───────────────────────────────────────
  redis:
    image: solr-experiments/redis:local
    build: { context: docker/redis }
    hostname: redis
    command: redis-server /usr/local/etc/redis/redis.conf --maxmemory 256mb
    ports:
      - "6379:6379"
    volumes: [redis-data:/data]
    networks: [solr-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  solr-net:
    driver: bridge

volumes:
  solr-data:
  redis-data:
