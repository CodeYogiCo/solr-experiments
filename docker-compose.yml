version: "3.9"

# ── Reusable fragments ────────────────────────────────────────────────────────
x-solr-common: &solr-common
  build:
    context: .
    dockerfile: docker/solr/Dockerfile
  image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-codeyogico/solr-experiments}/solr:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    ZK_HOST: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
    SOLR_HEAP: ${SOLR_HEAP:-2g}
  depends_on:
    zookeeper1: { condition: service_healthy }
    zookeeper2: { condition: service_healthy }
    zookeeper3: { condition: service_healthy }
  networks: [solr-net]
  volumes:
    - type: volume
      source: solr-data
      target: /var/solr/data
  restart: unless-stopped
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

x-zk-common: &zk-common
  build:
    context: .
    dockerfile: docker/zookeeper/Dockerfile
  image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-codeyogico/solr-experiments}/zookeeper:${IMAGE_TAG:-latest}
  env_file: .env
  networks: [solr-net]
  restart: unless-stopped

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── ZooKeeper ensemble ──────────────────────────────────────────────────────
  zookeeper1:
    <<: *zk-common
    hostname: zookeeper1
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: >-
        server.1=zookeeper1:2888:3888
        server.2=zookeeper2:2888:3888
        server.3=zookeeper3:2888:3888
      ZOO_4LW_COMMANDS_WHITELIST: mntr,conf,ruok,srvr,stat
    volumes:
      - zk1-data:/data
      - zk1-log:/datalog
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  zookeeper2:
    <<: *zk-common
    hostname: zookeeper2
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: >-
        server.1=zookeeper1:2888:3888
        server.2=zookeeper2:2888:3888
        server.3=zookeeper3:2888:3888
      ZOO_4LW_COMMANDS_WHITELIST: mntr,conf,ruok,srvr,stat
    volumes:
      - zk2-data:/data
      - zk2-log:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  zookeeper3:
    <<: *zk-common
    hostname: zookeeper3
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: >-
        server.1=zookeeper1:2888:3888
        server.2=zookeeper2:2888:3888
        server.3=zookeeper3:2888:3888
      ZOO_4LW_COMMANDS_WHITELIST: mntr,conf,ruok,srvr,stat
    volumes:
      - zk3-data:/data
      - zk3-log:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Solr cloud nodes ────────────────────────────────────────────────────────
  solr1:
    <<: *solr-common
    hostname: solr1
    ports:
      - "8983:8983"
    volumes:
      - solr1-data:/var/solr/data

  solr2:
    <<: *solr-common
    hostname: solr2
    ports:
      - "8984:8983"
    volumes:
      - solr2-data:/var/solr/data

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    build:
      context: docker/redis
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-codeyogico/solr-experiments}/redis:${IMAGE_TAG:-latest}
    hostname: redis
    env_file: .env
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [solr-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# ── Networks & Volumes ────────────────────────────────────────────────────────
networks:
  solr-net:
    driver: bridge

volumes:
  zk1-data:
  zk1-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  solr1-data:
  solr2-data:
  solr-data:
  redis-data:
