version: "3.9"

# Docker Swarm stack – deploy with:
#   docker stack deploy -c infra/swarm/docker-stack.yml solr
#
# Requirements:
#   docker swarm init   (on manager node)
#   docker swarm join   (on worker nodes, optional)
#   docker secret create redis_password <(echo "changeme")
#
# Works on: any cloud VM (DigitalOcean, Linode, Hetzner, AWS EC2, GCE, Azure VM)

x-solr: &solr
  image: ghcr.io/codeyogico/solr-experiments/solr:${IMAGE_TAG:-latest}
  networks: [solr-net]
  environment:
    ZK_HOST: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
    SOLR_HEAP: "${SOLR_HEAP:-2g}"
  secrets: [redis_password]
  deploy:
    replicas: 1
    update_config:
      parallelism: 1
      delay: 30s
      order: stop-first
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 3
    resources:
      limits:
        memory: 4g
      reservations:
        memory: 3g

x-zk: &zk
  image: ghcr.io/codeyogico/solr-experiments/zookeeper:${IMAGE_TAG:-latest}
  networks: [solr-net]
  environment:
    ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok,srvr,stat"
  deploy:
    replicas: 1
    restart_policy:
      condition: on-failure
    resources:
      limits:
        memory: 1g
      reservations:
        memory: 512m

services:
  # ── ZooKeeper ──────────────────────────────────────────────────────────────
  zookeeper1:
    <<: *zk
    hostname: zookeeper1
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: >-
        server.1=zookeeper1:2888:3888
        server.2=zookeeper2:2888:3888
        server.3=zookeeper3:2888:3888
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok,srvr,stat"
    volumes:
      - zk1-data:/data
      - zk1-log:/datalog
    deploy:
      <<: *zk.deploy
      placement:
        constraints: [node.hostname == manager1]

  zookeeper2:
    <<: *zk
    hostname: zookeeper2
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: >-
        server.1=zookeeper1:2888:3888
        server.2=zookeeper2:2888:3888
        server.3=zookeeper3:2888:3888
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok,srvr,stat"
    volumes:
      - zk2-data:/data
      - zk2-log:/datalog
    deploy:
      <<: *zk.deploy
      placement:
        constraints: [node.hostname == worker1]

  zookeeper3:
    <<: *zk
    hostname: zookeeper3
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: >-
        server.1=zookeeper1:2888:3888
        server.2=zookeeper2:2888:3888
        server.3=zookeeper3:2888:3888
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok,srvr,stat"
    volumes:
      - zk3-data:/data
      - zk3-log:/datalog
    deploy:
      <<: *zk.deploy
      placement:
        constraints: [node.hostname == worker2]

  # ── Solr nodes ─────────────────────────────────────────────────────────────
  solr1:
    <<: *solr
    hostname: solr1
    volumes: [solr1-data:/var/solr/data]
    ports: ["8983:8983"]
    deploy:
      <<: *solr.deploy
      placement:
        constraints: [node.hostname == manager1]

  solr2:
    <<: *solr
    hostname: solr2
    volumes: [solr2-data:/var/solr/data]
    deploy:
      <<: *solr.deploy
      placement:
        constraints: [node.hostname == worker1]

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: ghcr.io/codeyogico/solr-experiments/redis:${IMAGE_TAG:-latest}
    hostname: redis
    networks: [solr-net]
    secrets: [redis_password]
    command:
      - sh
      - -c
      - |
        PASS=$(cat /run/secrets/redis_password)
        exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$PASS"
    volumes: [redis-data:/data]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 700m
        reservations:
          memory: 600m

networks:
  solr-net:
    driver: overlay
    attachable: true

secrets:
  redis_password:
    external: true

volumes:
  zk1-data:
  zk1-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  solr1-data:
  solr2-data:
  redis-data:
