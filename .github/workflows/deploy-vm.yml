name: Deploy to Cloud

# One workflow for every cloud. Uses infra/provision.sh as the single entry point.
# The same Docker images, same deploy-to-vm.sh, same Solr/ZK/Redis stack —
# only the Terraform module changes per cloud.
#
# Required secrets (set per GitHub Environment):
#   VM_SSH_PRIVATE_KEY   – SSH private key
#   REDIS_PASSWORD       – Redis password
#
# Cloud-specific secrets (only the cloud you use):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (aws)
#   GCP_SA_KEY                                  (gcp – service account JSON)
#   AZURE_CREDENTIALS                           (azure – az ad sp output JSON)
#
# Variables (repo or environment level):
#   ADMIN_CIDR   – your IP for SSH access (e.g. 1.2.3.4/32)
#   SSH_PUBLIC_KEY – public key to inject into VMs

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "Target cloud"
        required: true
        type: choice
        options: [aws, gcp, azure]
      action:
        description: "What to do"
        required: true
        type: choice
        options:
          - apply          # provision infra + deploy (idempotent)
          - deploy-only    # skip Terraform, just push new images to existing VMs
          - plan           # show Terraform plan without applying
          - destroy        # tear down all cloud resources
      image_tag:
        description: "Image tag to deploy"
        required: true
        default: "latest"
      solr_nodes:
        description: "Solr node numbers to start (e.g. 1,2 or 3 for add-node)"
        default: "1,2"
      environment:
        description: "GitHub environment"
        required: true
        type: choice
        options: [production, staging]

env:
  REGISTRY:   ghcr.io
  IMAGE_REPO: ${{ github.repository }}
  IMAGE_TAG:  ${{ github.event.inputs.image_tag }}

jobs:
  deploy:
    name: "${{ github.event.inputs.action }} → ${{ github.event.inputs.cloud }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      # ── Write SSH key ──────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # ── Cloud auth ────────────────────────────────────────────────────────
      - name: Auth – AWS
        if: github.event.inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Auth – GCP
        if: github.event.inputs.cloud == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Auth – Azure
        if: github.event.inputs.cloud == 'azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Terraform ─────────────────────────────────────────────────────────
      - name: Setup Terraform
        if: github.event.inputs.action != 'deploy-only'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      # ── Write tfvars ──────────────────────────────────────────────────────
      - name: Write tfvars
        if: github.event.inputs.action != 'deploy-only'
        run: |
          CLOUD="${{ github.event.inputs.cloud }}"
          DIR="infra/terraform/${CLOUD}"
          cat > "${DIR}/terraform.tfvars" << EOF
          name             = "solr-stack"
          ssh_public_key   = "${{ vars.SSH_PUBLIC_KEY }}"
          admin_cidr       = "${{ vars.ADMIN_CIDR }}"
          image_tag        = "${{ env.IMAGE_TAG }}"

          # AWS specific
          aws_region       = "${{ vars.AWS_REGION || 'us-east-1' }}"

          # GCP specific
          project_id       = "${{ vars.GCP_PROJECT_ID || '' }}"
          region           = "${{ vars.GCP_REGION || 'us-central1' }}"

          # Azure specific
          location         = "${{ vars.AZURE_LOCATION || 'eastus' }}"
          EOF

      # ── Run unified provision script ──────────────────────────────────────
      - name: Provision + deploy
        run: |
          EXTRA=""
          [ "${{ github.event.inputs.action }}" = "deploy-only" ] && EXTRA="--update"

          bash infra/provision.sh \
            "${{ github.event.inputs.cloud }}" \
            "${{ github.event.inputs.action }}" \
            --tag      "${{ env.IMAGE_TAG }}" \
            --nodes    "${{ github.event.inputs.solr_nodes }}" \
            --ssh-key  ~/.ssh/deploy_key \
            --install \
            $EXTRA

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Output summary
        if: github.event.inputs.action != 'destroy' && github.event.inputs.action != 'plan'
        working-directory: infra/terraform/${{ github.event.inputs.cloud }}
        run: |
          echo "### Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          terraform output -json 2>/dev/null | python3 -c "
          import json, sys
          for k, v in json.load(sys.stdin).items():
              print(f'| {k} | \`{v[\"value\"]}\` |')
          " >> $GITHUB_STEP_SUMMARY || true

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key infra/terraform/*/terraform.tfvars
