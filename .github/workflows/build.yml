name: Build & Test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Build & unit-test the Java plugin ────────────────────────────────────
  plugin:
    name: Solr Redis Plugin (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Build & test plugin
        run: cd solr-redis-plugin && ./gradlew --no-daemon build

  # ── 2. Build images + end-to-end smoke test ─────────────────────────────────
  # The multi-stage Solr Dockerfile compiles the plugin internally, so this also
  # exercises the Gradle build inside Docker.
  smoke-test:
    name: Smoke Test (local stack)
    runs-on: ubuntu-latest
    needs: plugin
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for Solr + bestbuy collection
        run: |
          for i in $(seq 1 40); do
            if curl -sf "http://localhost:8983/solr/admin/collections?action=LIST" \
                 | grep -q '"bestbuy"'; then
              echo "collection ready"; exit 0
            fi
            sleep 5
          done
          echo "Solr/collection did not become ready"; docker compose logs solr; exit 1

      - name: Seed Redis bitmap (sku 1000001 in stock at store 1000)
        run: |
          docker compose exec -T redis redis-cli setbit store:1000:availability 1000001 1
          docker compose exec -T redis redis-cli setbit store:1000:availability 1000002 0

      - name: Index two products
        run: |
          curl -sf -X POST "http://localhost:8983/solr/bestbuy/update?commit=true" \
            -H 'Content-Type: application/json' \
            -d '[{"id":"1","sku":1000001,"name":"in stock laptop"},
                 {"id":"2","sku":1000002,"name":"out of stock laptop"}]'

      - name: Assert PostFilter drops the out-of-stock doc
        run: |
          N=$(curl -sf "http://localhost:8983/solr/bestbuy/select?q=*:*&fq=%7B!store_avail%20id=1000%7D&rows=0" \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)["response"]["numFound"])')
          echo "numFound with availability filter = $N (expected 1)"
          [ "$N" = "1" ]

      - name: Assert DocTransformer annotates availability
        run: |
          curl -sf "http://localhost:8983/solr/bestbuy/select?q=*:*&fl=sku,storeAvailable:%5Bstore_avail%20id=1000%5D" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin)["response"]["docs"]; assert any(x.get("storeAvailable") is True for x in d) and any(x.get("storeAvailable") is False for x in d), d; print("annotate OK")'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v
