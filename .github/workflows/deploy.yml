name: Deploy to Cloud

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "Target cloud provider"
        required: true
        type: choice
        options: [aws, gcp, azure, kubernetes]
      image_tag:
        description: "Image tag to deploy"
        required: true
        default: "latest"
      environment:
        description: "Environment"
        required: true
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag }}

jobs:
  # ── AWS ECS ──────────────────────────────────────────────────────────────────
  deploy-aws:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    if: github.event.inputs.cloud == 'aws'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Render ZooKeeper task definition
        id: zk-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/aws/ecs-task-zookeeper.json
          container-name: zookeeper
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/zookeeper:${{ env.IMAGE_TAG }}

      - name: Deploy ZooKeeper to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.zk-task-def.outputs.task-definition }}
          service:          solr-zookeeper
          cluster:          ${{ vars.AWS_ECS_CLUSTER || 'solr-cluster' }}
          wait-for-service-stability: true

      - name: Render Solr task definition
        id: solr-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/aws/ecs-task-solr.json
          container-name: solr
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/solr:${{ env.IMAGE_TAG }}

      - name: Deploy Solr to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.solr-task-def.outputs.task-definition }}
          service:          solr
          cluster:          ${{ vars.AWS_ECS_CLUSTER || 'solr-cluster' }}
          wait-for-service-stability: true

  # ── GCP GKE ──────────────────────────────────────────────────────────────────
  deploy-gcp:
    name: Deploy to GCP GKE
    runs-on: ubuntu-latest
    if: github.event.inputs.cloud == 'gcp'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GCP_GKE_CLUSTER }}
          location:     ${{ vars.GCP_REGION || 'us-central1' }}

      - name: Update image tags in manifests
        run: |
          TAG="${{ env.IMAGE_TAG }}"
          sed -i "s|:latest|:${TAG}|g" k8s/zookeeper/statefulset.yaml
          sed -i "s|:latest|:${TAG}|g" k8s/solr/statefulset.yaml
          sed -i "s|:latest|:${TAG}|g" k8s/redis/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/zookeeper/
          kubectl rollout status statefulset/zookeeper -n solr-stack --timeout=180s
          kubectl apply -f k8s/redis/
          kubectl rollout status deployment/redis -n solr-stack --timeout=60s
          kubectl apply -f k8s/solr/
          kubectl rollout status statefulset/solr -n solr-stack --timeout=300s

  # ── Azure AKS ────────────────────────────────────────────────────────────────
  deploy-azure:
    name: Deploy to Azure AKS
    runs-on: ubuntu-latest
    if: github.event.inputs.cloud == 'azure'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name:   ${{ vars.AZURE_AKS_CLUSTER }}

      - name: Update image tags
        run: |
          TAG="${{ env.IMAGE_TAG }}"
          sed -i "s|:latest|:${TAG}|g" k8s/zookeeper/statefulset.yaml
          sed -i "s|:latest|:${TAG}|g" k8s/solr/statefulset.yaml
          sed -i "s|:latest|:${TAG}|g" k8s/redis/deployment.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/zookeeper/
          kubectl rollout status statefulset/zookeeper -n solr-stack --timeout=180s
          kubectl apply -f k8s/redis/
          kubectl apply -f k8s/solr/
          kubectl rollout status statefulset/solr -n solr-stack --timeout=300s

  # ── Generic Kubernetes (kubeconfig secret) ────────────────────────────────────
  deploy-kubernetes:
    name: Deploy to Kubernetes (generic)
    runs-on: ubuntu-latest
    if: github.event.inputs.cloud == 'kubernetes'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Set kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tags
        run: |
          TAG="${{ env.IMAGE_TAG }}"
          sed -i "s|:latest|:${TAG}|g" k8s/zookeeper/statefulset.yaml
          sed -i "s|:latest|:${TAG}|g" k8s/solr/statefulset.yaml
          sed -i "s|:latest|:${TAG}|g" k8s/redis/deployment.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/zookeeper/
          kubectl rollout status statefulset/zookeeper -n solr-stack --timeout=180s
          kubectl apply -f k8s/redis/
          kubectl apply -f k8s/solr/
          kubectl rollout status statefulset/solr -n solr-stack --timeout=300s
