apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: solr-stack
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: solr-stack
type: Opaque
stringData:
  password: "changeme"   # REPLACE with a real secret in production; use Vault / SealedSecrets
