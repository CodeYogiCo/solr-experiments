apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: solr-stack
spec:
  serviceName: zookeeper-headless
  replicas: 3
  selector:
    matchLabels:
      app: zookeeper
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: OrderedReady
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: zookeeper
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: zookeeper
          image: ghcr.io/codeyogico/solr-experiments/zookeeper:latest
          imagePullPolicy: Always
          ports:
            - name: client
              containerPort: 2181
            - name: follower
              containerPort: 2888
            - name: election
              containerPort: 3888
            - name: admin
              containerPort: 8080
          env:
            - name: ZOO_MY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ZOO_SERVERS
              value: >-
                server.1=zookeeper-0.zookeeper-headless.solr-stack.svc.cluster.local:2888:3888
                server.2=zookeeper-1.zookeeper-headless.solr-stack.svc.cluster.local:2888:3888
                server.3=zookeeper-2.zookeeper-headless.solr-stack.svc.cluster.local:2888:3888
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "mntr,conf,ruok,srvr,stat"
          # ZOO_MY_ID must be 1-based ordinal; extracted from pod name via init container below
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: datalog
              mountPath: /datalog
      initContainers:
        - name: set-zoo-my-id
          image: busybox
          command:
            - sh
            - -c
            - |
              # Extract ordinal index from pod name (e.g. zookeeper-0 → 1)
              ORDINAL=$(echo $POD_NAME | awk -F'-' '{print $NF}')
              echo "$((ORDINAL + 1))" > /data/myid
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: datalog
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
