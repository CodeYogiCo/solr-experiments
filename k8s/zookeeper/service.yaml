---
# Headless service for stable DNS within the ensemble
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: solr-stack
spec:
  clusterIP: None
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
    - name: follower
      port: 2888
    - name: election
      port: 3888
---
# ClusterIP for Solr clients
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: solr-stack
spec:
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
