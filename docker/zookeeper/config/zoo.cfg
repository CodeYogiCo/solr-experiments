tickTime=2000
initLimit=10
syncLimit=5
dataDir=/data
dataLogDir=/datalog
clientPort=2181
maxClientCnxns=200
autopurge.snapRetainCount=5
autopurge.purgeInterval=24
admin.enableServer=true
admin.serverPort=8080

# 4lw commands – expose only safe ones
4lw.commands.whitelist=mntr,conf,ruok,srvr,stat,wchs,dirs,grs,envi,srst,isro

# TLS (uncomment and mount certs for production mTLS)
# secureClientPort=2281
# ssl.keyStore.location=/certs/zookeeper.jks
# ssl.trustStore.location=/certs/truststore.jks

# Ensemble members (override via ZOO_SERVERS env var at runtime)
server.1=${ZOO_SERVER_1:-zookeeper1}:2888:3888
server.2=${ZOO_SERVER_2:-zookeeper2}:2888:3888
server.3=${ZOO_SERVER_3:-zookeeper3}:2888:3888
