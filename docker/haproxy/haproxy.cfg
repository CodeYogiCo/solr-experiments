global
  maxconn 4096
  log     stdout format raw local0 info

defaults
  mode    tcp
  log     global
  option  tcplog
  option  dontlognull
  timeout connect 5s
  timeout client  60s
  timeout server  60s
  # ZooKeeper sessions are long-lived; give them plenty of time
  timeout tunnel  1h

# ── ZooKeeper client port load balancer ───────────────────────────────────────
frontend zookeeper_client
  bind *:2181
  default_backend zookeeper_nodes

backend zookeeper_nodes
  balance roundrobin
  option  tcp-check
  # ZK health check: send "ruok\n", expect "imok" back
  tcp-check connect
  tcp-check send ruok\n
  tcp-check expect string imok

  server zk1 zookeeper1:2181 check inter 5s rise 2 fall 3
  server zk2 zookeeper2:2181 check inter 5s rise 2 fall 3
  server zk3 zookeeper3:2181 check inter 5s rise 2 fall 3

# ── HAProxy stats UI (http://localhost:8404/stats) ───────────────────────────
frontend stats
  bind *:8404
  mode http
  stats enable
  stats uri /stats
  stats refresh 5s
  stats show-legends
  stats show-node
