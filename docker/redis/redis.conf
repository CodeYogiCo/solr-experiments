# ── Network ───────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
# Local playground only — no auth, reachable from the Solr container on the
# Docker network. Do not expose this Redis to untrusted networks.
protected-mode no

# ── Memory ────────────────────────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Persistence (RDB + AOF for durability) ────────────────────────────────────
save 900 1
save 300 10
save 60  10000
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── Performance ───────────────────────────────────────────────────────────────
tcp-backlog 511
tcp-keepalive 300
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ── Bitmaps – store availability ─────────────────────────────────────────────
# Bitmaps use String type; no special config required.
# Key pattern: store:{storeId}:availability
# Bit offset  = product numeric SKU
# SETBIT / GETBIT / BITCOUNT are used for O(1) availability checks.

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── Slow log ─────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128
